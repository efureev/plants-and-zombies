plugins {
	id 'java-library'
	id 'maven-publish'
	id 'idea'
	id 'net.neoforged.moddev' version "${moddev_version}"
	id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
}

version = project.mod_version
group = project.mod_group_id

base {
	archivesName = project.archives_base_name
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(25)
	withSourcesJar()
}

kotlin {
	jvmToolchain(25)
}

repositories {
	maven {
		name = 'Kotlin for Forge'
		url = 'https://thedarkcolour.github.io/KotlinForForge/'
		content { includeGroup 'thedarkcolour' }
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter { includeGroup 'maven.modrinth' }
	}
}

sourceSets.main.resources {
	exclude('**/*.bbmodel')
}

neoForge {
	version = project.neo_version

	runs {
		client {
			client()
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
		}
		server {
			server()
			programArgument '--nogui'
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
		}
		gameTestServer {
			type = 'gameTestServer'
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
		}
		configureEach {
			systemProperty 'forge.logging.markers', 'REGISTRIES'
			logLevel = org.slf4j.event.Level.INFO
		}
	}

	mods {
		"${mod_id}" {
			sourceSet(sourceSets.main)
		}
	}
}

configurations {
	runtimeClasspath.extendsFrom localRuntime
}

dependencies {
	implementation "thedarkcolour:kotlinforforge-neoforge:${project.kff_version}"

	compileOnly "maven.modrinth:terrablender:${project.terrablender_version}"
	// Dev runs only: without TerraBlender, OverworldBiomeBuilderMixin adds sproutsquad:graveyard to the
	// built-in vanilla biome set, which the IDE-only Bootstrap.validate() rejects.
	localRuntime "maven.modrinth:terrablender:${project.terrablender_version}"
	compileOnly "maven.modrinth:iris:${project.iris_version}"
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
	var replaceProperties = [
		minecraft_version      : minecraft_version,
		minecraft_version_range: minecraft_version_range,
		neo_version            : neo_version,
		kff_version            : kff_version,
		mod_id                 : mod_id,
		mod_name               : mod_name,
		mod_license            : mod_license,
		mod_version            : version.toString(),
	]
	inputs.properties replaceProperties
	expand replaceProperties
	from 'src/main/templates'
	into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

jar {
	inputs.property 'archivesName', project.base.archivesName

	from('LICENSE') {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

tasks.register('devBuild') {
	group = 'build'
	description = 'Builds a development jar (e.g. sprout-squad-0.1.0-dev.42.jar)'

	doFirst {
		def buildNum = getNextDevBuildNumber()
		def devVersion = "${project.mod_version}-dev.${buildNum}"

		project.version = devVersion
		println ">>> Building DEV version: ${devVersion}"
	}

	finalizedBy('build')
}

publishing {
	publications {
		register('mavenJava', MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}

def getNextDevBuildNumber() {
	def numberFile = file('dev_build.number')

	def current = 0
	if (numberFile.exists()) {
		current = numberFile.text.trim().toInteger()
	}

	def next = current + 1
	numberFile.text = next.toString() + '\n'

	return next
}
