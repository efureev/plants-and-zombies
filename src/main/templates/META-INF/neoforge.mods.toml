modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"
issueTrackerURL="https://github.com/efureev/plants-and-zombies/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/efureev/plants-and-zombies"
iconFile="sprout_squad_icon.png"
authors="joshxviii, efureev"
credits="Based on Plants & Zombies by joshxviii (https://github.com/joshxviii/plants-and-zombies), MPL-2.0"
description='''
Find and grow helpful Plants that can defend your base from Zombies.
Sprout Squad grows its own squad of new characters on top of Plants & Zombies.
'''

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[mixins]]
config="sproutsquad.mixins.json"

[[mixins]]
config="sproutsquad.client.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="kotlinforforge"
    type="required"
    versionRange="[${kff_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="terrablender"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="iris"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="CLIENT"
